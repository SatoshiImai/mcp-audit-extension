[project]
name = "auditable-mcp"
version = "0.1.0"
description = "Auditable MCP Python reference implementation (mirror of the TypeScript reference)"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "jsonschema",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
